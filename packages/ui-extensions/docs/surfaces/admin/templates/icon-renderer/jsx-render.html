<!DOCTYPE html>
<html>
  <head>
    <style>
      html, body {height:100%} body {{{COMPOSED_STYLES}}}
    </style>
    <script src="https://cdn.shopify.com/shopifycloud/polaris.js"></script>
    <script src="https://cdn.shopify.com/shopifycloud/jsx-builder/jsx-builder.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    {{BODY_CONTENT}}
    <script>
      (function () {
        const {render, h, Fragment, Component, useState, useEffect} =
          window.preact;
        const jsxCode = `const App = () => { {{JSX_CODE}} };`;
        try {
          const {code} = window.sucrase.transform(jsxCode, {
            transforms: ['jsx'],
            jsxPragma: 'h',
            jsxFragmentPragma: 'Fragment',
            production: true,
          });
          const fn = new Function(
            'h',
            'Fragment',
            'Component',
            'useState',
            'useEffect',
            code + '; return App;',
          );
          const App = fn(h, Fragment, Component, useState, useEffect);
          const target =
            document.getElementById('wrapper-element') || document.body;
          if (target) render(h(App), target);
        } catch (e) {
          console.error('JSX Transform Error:', e);
        }
      })();
    </script>
  </body>
</html>
