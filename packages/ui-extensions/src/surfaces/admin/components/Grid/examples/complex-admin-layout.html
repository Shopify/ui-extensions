<s-stack gap="base">
  <s-grid gridTemplateColumns="repeat(12, 1fr)" gap="large">
    <s-grid-item gridColumn="span 12" gridRow="span 1">
      <s-section>
        <s-text>Page header</s-text>
      </s-section>
    </s-grid-item>
    <s-grid-item gridColumn="span 9" gridRow="span 2">
      <s-section>
        <s-text>Main content area</s-text>
      </s-section>
    </s-grid-item>
    <s-grid-item gridColumn="span 3" gridRow="span 2">
      <s-section>
        <s-text>Actions panel</s-text>
      </s-section>
    </s-grid-item>
    <s-grid-item gridColumn="span 12" gridRow="span 3">
      <s-section>
        <s-text>Full width section</s-text>
      </s-section>
    </s-grid-item>
  </s-grid>
</s-stack>
