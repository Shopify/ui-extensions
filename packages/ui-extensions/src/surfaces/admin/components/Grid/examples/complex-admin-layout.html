<s-stack gap="base">
  <s-grid gridTemplateColumns="repeat(12, 1fr)" gap="large">
    <s-grid-item gridColumn="1 / span 12" gridRow="1">
      <s-box padding="base">Page header</s-box>
    </s-grid-item>
    <s-grid-item gridColumn="1 / span 9" gridRow="2">
      <s-box padding="base">Main content area</s-box>
    </s-grid-item>
    <s-grid-item gridColumn="10 / span 3" gridRow="2">
      <s-box padding="base">Actions panel</s-box>
    </s-grid-item>
    <s-grid-item gridColumn="1 / span 12" gridRow="3">
      <s-box padding="base">Full width section</s-box>
    </s-grid-item>
  </s-grid>
</s-stack>
