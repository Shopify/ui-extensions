<s-stack gap="base">
  <s-grid gridTemplateColumns="repeat(12, 1fr)" gap="base">
    <s-grid-item gridColumn="1 / span 12" gridRow="1">
      <s-box padding="base">Full width field</s-box>
    </s-grid-item>
    <s-grid-item gridColumn="1 / span 6" gridRow="2">
      <s-box padding="base">Half width field</s-box>
    </s-grid-item>
    <s-grid-item gridColumn="7 / span 6" gridRow="2">
      <s-box padding="base">Half width field</s-box>
    </s-grid-item>
    <s-grid-item gridColumn="1 / span 4" gridRow="3">
      <s-box padding="base">Third width field</s-box>
    </s-grid-item>
    <s-grid-item gridColumn="5 / span 4" gridRow="3">
      <s-box padding="base">Third width field</s-box>
    </s-grid-item>
    <s-grid-item gridColumn="9 / span 4" gridRow="3">
      <s-box padding="base">Third width field</s-box>
    </s-grid-item>
  </s-grid>
</s-stack>
