<s-stack gap="base">
  <s-grid gridTemplateColumns="repeat(12, 1fr)" gap="large">
    <s-grid-item gridColumn="1 / span 12" gridRow="1">
      <s-box padding="base">Header</s-box>
    </s-grid-item>
    <s-grid-item gridColumn="1 / span 8" gridRow="2">
      <s-box padding="base">Main content</s-box>
    </s-grid-item>
    <s-grid-item gridColumn="9 / span 4" gridRow="2">
      <s-box padding="base">Sidebar</s-box>
    </s-grid-item>
  </s-grid>
</s-stack>
