<s-stack gap="base">
  <!-- Automatically responsive: 6 columns on mobile, 12 on desktop -->
  <s-grid gap="base">
    <s-grid-item gridColumn="1 / span 6" gridRow="1">
      <s-box padding="base">Full width on mobile, half on desktop</s-box>
    </s-grid-item>
    <s-grid-item gridColumn="7 / span 3" gridRow="1">
      <s-box padding="base">Half width on mobile, quarter on desktop</s-box>
    </s-grid-item>
    <s-grid-item gridColumn="10 / span 3" gridRow="1">
      <s-box padding="base">Half width on mobile, quarter on desktop</s-box>
    </s-grid-item>
  </s-grid>
</s-stack>
