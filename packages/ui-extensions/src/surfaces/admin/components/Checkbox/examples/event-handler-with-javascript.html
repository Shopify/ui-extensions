<s-stack gap="base">
  <s-checkbox
    label="Enable email notifications"
    value="email-notifications"
    onchange="document.getElementById('output').textContent = 'Status: ' + (this.checked ? 'enabled' : 'disabled') + ', Value: ' + this.value;"
  ></s-checkbox>

  <s-text id="output" color="subdued">Status: ready</s-text>
</s-stack>
