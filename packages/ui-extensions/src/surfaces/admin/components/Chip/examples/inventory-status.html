<s-stack direction="inline" gap="base">
  <s-chip color="strong" accessibilityLabel="Inventory status">
    <s-icon slot="graphic" type="check" size="small"></s-icon>
    In stock
  </s-chip>
  <s-chip color="base" accessibilityLabel="Inventory warning">
    <s-icon slot="graphic" type="alert-triangle" size="small"></s-icon>
    Low stock
  </s-chip>
  <s-chip color="subdued" accessibilityLabel="Inventory status">
    Out of stock
  </s-chip>
</s-stack>
