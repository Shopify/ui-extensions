<s-stack direction="inline" gap="base">
  <s-chip color="strong" accessibilityLabel="Order fulfillment status">
    <s-icon slot="graphic" type="check" size="small"></s-icon>
    Fulfilled
  </s-chip>
  <s-chip color="base" accessibilityLabel="Order status">
    <s-icon slot="graphic" type="clock" size="small"></s-icon>
    Processing
  </s-chip>
  <s-chip color="subdued" accessibilityLabel="Order status">Pending</s-chip>
</s-stack>
