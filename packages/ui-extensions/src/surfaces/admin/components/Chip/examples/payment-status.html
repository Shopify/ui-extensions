<s-stack direction="inline" gap="base">
  <s-chip color="strong" accessibilityLabel="Payment status">
    <s-icon slot="graphic" type="check" size="small"></s-icon>
    Paid
  </s-chip>
  <s-chip color="base" accessibilityLabel="Payment status">
    <s-icon slot="graphic" type="clock" size="small"></s-icon>
    Pending
  </s-chip>
  <s-chip color="subdued" accessibilityLabel="Payment status">
    <s-icon slot="graphic" type="x" size="small"></s-icon>
    Failed
  </s-chip>
</s-stack>
