<!-- Save Bar integration - wrap forms with data-save-bar attribute -->
<form data-save-bar>
  <s-section heading="Basic information">
    <s-box border="base" borderRadius="base" padding="base">
      <s-stack direction="block" gap="base">
        <s-text-field
          label="Title"
          name="title"
          value="Premium Cotton T-Shirt"
          helpText="Minimum 10 characters recommended"
        ></s-text-field>
        <s-text-area
          label="Description"
          name="description"
          value="Our premium cotton t-shirt is made from 100% organic cotton."
          rows="4"
        ></s-text-area>
      </s-stack>
    </s-box>
  </s-section>
</form>
