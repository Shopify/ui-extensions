<s-box
  border="base"
  borderRadius="base"
  overflow="hidden"
  maxInlineSize="216px"
>
  <s-clickable href="">
    <s-image
      aspectRatio="1/1"
      objectFit="cover"
      alt="Illustration of characters with a 4-piece puzzle"
      src="https://cdn.shopify.com/static/images/polaris/patterns/4-pieces.png"
    ></s-image>
  </s-clickable>
  <s-divider></s-divider>
  <s-grid
    gridTemplateColumns="1fr auto"
    background="base"
    padding="small"
    gap="small"
    alignItems="center"
  >
    <s-heading>4-Pieces</s-heading>
    <s-button accessibilityLabel="Edit 4-pieces puzzle in Shopify">Edit</s-button>
  </s-grid>
</s-box>
