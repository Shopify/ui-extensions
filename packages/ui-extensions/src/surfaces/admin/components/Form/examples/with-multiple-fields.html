<s-form>
  <s-stack direction="block" gap="base">
    <s-text-field label="Campaign name" name="campaign" required></s-text-field>
    <s-date-field label="Start date" name="startDate" required></s-date-field>
    <s-date-field label="End date" name="endDate"></s-date-field>
    <s-money-field label="Budget" name="budget" currency-code="USD"></s-money-field>
    <s-stack direction="inline" gap="base">
      <s-button variant="primary" accessibilityRole="submit">Create campaign</s-button>
      <s-button accessibilityRole="reset">Reset</s-button>
    </s-stack>
  </s-stack>
</s-form>
