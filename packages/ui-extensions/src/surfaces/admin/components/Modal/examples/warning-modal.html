<s-stack gap="base">
  <s-button commandFor="warning-modal-example" command="--show">
    View inventory warning
  </s-button>

  <s-modal
    id="warning-modal-example"
    heading="Low inventory warning"
    size="base"
  >
    <s-stack gap="base">
      <s-banner tone="warning">
        <s-text>
          You have 3 products with critically low inventory levels.
        </s-text>
      </s-banner>

      <s-stack gap="small">
        <s-text type="strong">Affected products:</s-text>
        <s-list>
          <s-list-item>Winter jacket (2 remaining)</s-list-item>
          <s-list-item>Wool scarf (0 remaining)</s-list-item>
          <s-list-item>Leather gloves (1 remaining)</s-list-item>
        </s-list>
      </s-stack>

      <s-text tone="subdued">
        Consider restocking these items to avoid lost sales.
      </s-text>
    </s-stack>

    <s-button
      slot="primary-action"
      variant="primary"
      commandFor="warning-modal-example"
      command="--hide"
    >
      View inventory
    </s-button>
    <s-button
      slot="secondary-actions"
      variant="secondary"
      commandFor="warning-modal-example"
      command="--hide"
    >
      Dismiss
    </s-button>
  </s-modal>
</s-stack>
