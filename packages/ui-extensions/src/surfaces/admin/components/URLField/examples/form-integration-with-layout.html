<!-- Multiple URL fields with layout -->
<s-box padding="base">
  <s-stack gap="base">
    <s-url-field
      label="Store URL"
      required
      placeholder="https://your-store.myshopify.com"
    ></s-url-field>
    <s-url-field
      label="Social media URL"
      placeholder="https://facebook.com/yourstore"
    ></s-url-field>
  </s-stack>
</s-box>
