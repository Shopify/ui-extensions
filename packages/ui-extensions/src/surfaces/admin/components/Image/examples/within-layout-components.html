<s-grid gridTemplateColumns="repeat(3, 150px)" gap="base" alignItems="center">
  <s-image
    src="/images/product.webp"
    alt="Main view"
    aspectRatio="1/1"
    objectFit="cover"
    borderRadius="base"
    inlineSize="fill"
  ></s-image>
  <s-image
    src="/images/product.webp"
    alt="Side view"
    aspectRatio="1/1"
    objectFit="cover"
    borderRadius="base"
    inlineSize="fill"
  ></s-image>
  <s-image
    src="/images/product.webp"
    alt="Detail view"
    aspectRatio="1/1"
    objectFit="cover"
    borderRadius="base"
    inlineSize="fill"
  ></s-image>
</s-grid>
