<s-query-container id="responsive-card" containerName="card">
  <s-box
    background="base"
    borderColor="base"
    borderWidth="thin"
    borderRadius="base"
    class="cardContent"
  >
    <s-box>
      <s-heading>Left column</s-heading>
      <s-text color="subdued">Content here</s-text>
    </s-box>
    <s-box>
      <s-heading>Right column</s-heading>
      <s-text color="subdued">More content</s-text>
    </s-box>
  </s-box>
</s-query-container>

<style>
  @container card (min-width: 400px) {
    .cardContent {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--p-space-base);
      padding: var(--p-space-large);
    }
  }
  @container card (max-width: 399px) {
    .cardContent {
      padding: var(--p-space-base);
    }
  }
</style>
