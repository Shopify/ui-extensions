<s-query-container id="layout-container" containerName="layout">

    <s-box padding="base" background="subdued">
      <s-text>Item 1</s-text>
    </s-box>
    <s-box padding="base" background="subdued">
      <s-text>Item 2</s-text>
    </s-box>
    <s-box padding="base" background="subdued">
      <s-text>Item 3</s-text>
    </s-box>
