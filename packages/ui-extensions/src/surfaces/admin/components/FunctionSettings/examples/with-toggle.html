<s-function-settings>
  <s-stack direction="block" gap="base">
    <s-switch label="Enable free shipping threshold" name="freeShippingEnabled" checked></s-switch>
    <s-number-field
      step="0.01"
      prefix="$"
      label="Minimum order amount"
      name="freeShippingThreshold"
      value="75.00"
      min="0"
    ></s-number-field>
  </s-stack>
</s-function-settings>
