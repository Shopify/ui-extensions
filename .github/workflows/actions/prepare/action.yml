name: Prepare repo
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
      name: Setup node.js and yarn
      with:
        cache: yarn
        node-version-file: '.nvmrc'

    - name: Yarn install
      run: yarn install --frozen-lockfile
      shell: bash
