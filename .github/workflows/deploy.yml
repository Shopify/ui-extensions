name: Deploy

on:
  push:
    branches:
      # Stable version branches
      - 2023-04
      - 2023-07
      - 2023-10
      - 2024-01
      - 2024-04
      - 2024-07
      - 2024-10
      - 20[0-9][0-9]-[01][1470]
      # RC version branches
      - 20[0-9][0-9]-[01][1470]-rc
  # Snapit trigger - runs when /snapit comment is made on a PR
  issue_comment:
    types:
      - created
  # Snapshot publish trigger - started by the snapit job, never by hand
  workflow_dispatch:
    inputs:
      snapit_comment_id:
        description: 'PR comment requesting a snapshot (set automatically by /snapit)'
        required: true
        type: string
      snapit_sha:
        description: 'PR commit to publish (set automatically by /snapit)'
        required: true
        type: string

# Comment and snapshot runs execute on the default branch ref, so they get their own group
# to avoid replacing a pending release run for that branch.
concurrency: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}

jobs:
  # npm rejects trusted publishing (OIDC) tokens from issue_comment runs, so /snapit only
  # requests a workflow_dispatch run, which publishes.
  snapit:
    name: Request snapshot
    if: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.body == '/snapit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: write
    steps:
      - name: Request a snapshot release
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const {comment, issue, repository} = context.payload;
            try {
              const {data: collaborator} = await github.rest.repos.getCollaboratorPermissionLevel({
                ...context.repo,
                username: comment.user.login,
              });
              if (!['write', 'admin'].includes(collaborator.permission)) {
                throw new Error('Only users with write permission to the repository can run /snapit.');
              }

              const {data: pullRequest} = await github.rest.pulls.get({
                ...context.repo,
                pull_number: issue.number,
              });
              if (pullRequest.state !== 'open' && !pullRequest.merged) {
                throw new Error('Snapshots can only be requested for open or merged pull requests.');
              }
              if (pullRequest.head.repo?.full_name !== repository.full_name) {
                throw new Error('/snapit is not supported on pull requests from forked repositories.');
              }

              await github.rest.actions.createWorkflowDispatch({
                ...context.repo,
                workflow_id: 'deploy.yml',
                ref: repository.default_branch,
                inputs: {
                  snapit_comment_id: String(comment.id),
                  snapit_sha: pullRequest.head.sha,
                },
              });
              await github.rest.reactions.createForIssueComment({
                ...context.repo,
                comment_id: comment.id,
                content: 'eyes',
              }).catch((error) => core.warning(`Snapshot requested, but the reaction failed: ${error.message}`));
              core.info(`Requested a snapshot for PR #${issue.number} at ${pullRequest.head.sha}.`);
            } catch (error) {
              core.setFailed(error.message);
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: `Unable to request a snapshot: ${error.message}`,
              });
            }

  snapshot-release:
    name: Publish PR snapshot
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write # Required for OIDC
    steps:
      # WARNING: DO NOT CHECK OUT OR RUN ANY PR CODE BEFORE THIS STEP
      # Anyone who can dispatch the workflow controls the inputs, so recheck the original request.
      - name: Validate snapshot request
        id: request
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const {snapit_comment_id: commentId, snapit_sha: sha} = context.payload.inputs;
            if (
              !/^[1-9]\d*$/.test(commentId) ||
              !Number.isSafeInteger(Number(commentId)) ||
              !/^[a-f0-9]{40}$/.test(sha)
            ) {
              throw new Error('A snapshot request requires a comment ID and a full PR commit SHA.');
            }

            const {data: comment} = await github.rest.issues.getComment({
              ...context.repo,
              comment_id: Number(commentId),
            });
            if (comment.body !== '/snapit') {
              throw new Error('The requesting comment must contain /snapit.');
            }
            const {data: collaborator} = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo,
              username: comment.user.login,
            });
            if (!['write', 'admin'].includes(collaborator.permission)) {
              throw new Error('Only users with write permission to the repository can run /snapit.');
            }

            const issueUrlPrefix = `https://api.github.com/repos/${context.repo.owner}/${context.repo.repo}/issues/`;
            const pullRequestNumber = Number(comment.issue_url.slice(issueUrlPrefix.length));
            if (
              !comment.issue_url.startsWith(issueUrlPrefix) ||
              !Number.isSafeInteger(pullRequestNumber) ||
              pullRequestNumber < 1
            ) {
              throw new Error('The requesting comment must belong to a PR in this repository.');
            }
            const {data: pullRequest} = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pullRequestNumber,
            });
            // Keep enough context to report failures for an authorized request.
            core.setOutput('pull_request', pullRequestNumber);
            core.setOutput('comment_id', comment.id);
            core.setOutput('requester', comment.user.login);
            core.setOutput('sha', sha);
            if (
              (pullRequest.state !== 'open' && !pullRequest.merged) ||
              pullRequest.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`
            ) {
              throw new Error('Snapshots require an open or merged PR from this repository.');
            }
            if (pullRequest.head.sha !== sha) {
              throw new Error('The PR changed after the request. Post /snapit again to publish the current commit.');
            }

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.request.outputs.sha }}
          # @changesets/changelog-github reads git history to find the commit that added each changeset
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/workflows/actions/prepare

      - name: Update npm to 11.7
        run: npm install -g npm@11.7

      - name: Publish snapshot
        id: publish
        run: |
          yarn changeset:exit-pre-mode
          yarn changeset version --snapshot snapshot
          # With no changesets, `changeset version` succeeds without bumping, and publish would ship the current version under the snapshot tag.
          VERSIONS=$(for pkg in packages/*/package.json; do jq -c 'select((.private | not) and (.version | contains("-snapshot-"))) | {(.name): .version}' "$pkg"; done | jq -sc 'add // {}')
          if [ "$VERSIONS" = '{}' ]; then
            echo "::error::No snapshot versions were generated. Add a changeset to the PR, then post /snapit again."
            exit 1
          fi
          echo "versions=$VERSIONS" >> "$GITHUB_OUTPUT"
          yarn build
          yarn changeset publish --no-git-tags --snapshot --tag snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Used by @changesets/changelog-github
          NPM_TOKEN: '' # Forces OIDC authentication
          NPM_CONFIG_PROVENANCE: true

      - name: Report snapshot result
        if: ${{ always() && steps.request.outputs.pull_request != '' }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          SNAPSHOT_OUTCOME: ${{ steps.publish.outcome }}
          SNAPSHOT_VERSIONS: ${{ steps.publish.outputs.versions }}
          SNAPSHOT_PR: ${{ steps.request.outputs.pull_request }}
          SNAPSHOT_COMMENT: ${{ steps.request.outputs.comment_id }}
          SNAPSHOT_REQUESTER: ${{ steps.request.outputs.requester }}
          SNAPSHOT_SHA: ${{ steps.request.outputs.sha }}
        with:
          script: |
            const {
              SNAPSHOT_OUTCOME: outcome,
              SNAPSHOT_VERSIONS: versionsJson,
              SNAPSHOT_REQUESTER: requester,
              SNAPSHOT_SHA: sha,
            } = process.env;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const versions = Object.entries(JSON.parse(versionsJson || '{}'));
            const published = outcome === 'success' && versions.length > 0;
            const multiple = versions.length > 1;
            const body = published
              ? [
                  `🫰✨ **Thanks @${requester}! Your snapshot${multiple ? 's have' : ' has'} been published to npm.**`,
                  `Built from \`${sha}\`. [Workflow run](${runUrl}).`,
                  `Test the snapshot${multiple ? 's' : ''} by updating your \`package.json\` with the newly published version${multiple ? 's' : ''}:`,
                  ['```json', versions.map(([name, version]) => `"${name}": "${version}"`).join(',\n'), '```'].join('\n'),
                ].join('\n\n')
              : `The snapshot requested by @${requester} for \`${sha}\` could not be published. [View the workflow run](${runUrl}).`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: Number(process.env.SNAPSHOT_PR),
              body,
            });
            await github.rest.reactions.createForIssueComment({
              ...context.repo,
              comment_id: Number(process.env.SNAPSHOT_COMMENT),
              content: published ? 'rocket' : 'confused',
            });

  changesets:
    name: Deploy
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for OIDC
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.SHOPIFY_GH_ACCESS_TOKEN }}

      - uses: ./.github/workflows/actions/prepare

      - name: Update npm to 11.7
        run: npm install -g npm@11.7

      - id: changesets
        name: Create release Pull Request or publish to NPM
        uses: changesets/action@e0145edc7d9d8679003495b11f87bd8ef63c0cba # v1.5.3
        with:
          title: Version Packages (${{ github.ref_name }})
          # Pins YYYY.MM after `changeset version` — see scripts/changeset-version.mjs
          version: yarn version:calendar
          publish: yarn run deploy ${{ !endsWith(github.ref_name, '-rc') && format('--tag {0}', github.ref_name) || '' }} # no tag for RC branches.
          createGithubReleases: false
        env:
          NPM_TOKEN: '' # Forces OIDC authentication
          GITHUB_TOKEN: ${{ secrets.SHOPIFY_GH_ACCESS_TOKEN }}

      # Known to fail in OIDC (https://github.com/npm/cli/issues/8547).
      # Workaround is to manually ask #help-eng-infrastructure to update `latest` tag.
      - name: Set 'latest' NPM dist tag
        if: steps.changesets.outputs.published == 'true' && github.ref_name == vars.LATEST_STABLE_VERSION
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          for pkg in $(echo "$PUBLISHED_PACKAGES" | jq -r '.[] | @base64'); do
            _jq() {
              echo ${pkg} | base64 --decode | jq -r ${1}
            }
            npm dist-tag add $(_jq '.name')@$(_jq '.version') latest
          done
