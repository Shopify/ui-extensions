name: Snapit

on:
  issue_comment:
    types:
      - created

jobs:
  snapit:
    name: Snapit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.SHOPIFY_GH_ACCESS_TOKEN }}

      - uses: ./.github/workflows/actions/prepare

      - name: Create snapshot
        uses: Shopify/snapit@main
        env:
          GITHUB_TOKEN: ${{ secrets.SHOPIFY_GH_ACCESS_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        with:
          build_script: |
            yarn build
            yarn changeset pre exit
            # Backup and modify changeset config to disable GitHub changelog for snapshots
            cp .changeset/config.json .changeset/config.json.bak
            echo '{"changelog": false, "commit": false, "access": "restricted", "baseBranch": "unstable", "updateInternalDependencies": "patch", "ignore": []}' > .changeset/config.json
          comment_command: /snapit

      - name: Restore changeset config
        if: always()
        run: |
          if [ -f .changeset/config.json.bak ]; then
            mv .changeset/config.json.bak .changeset/config.json
          fi
