# Labels Shopify staff PRs for shopify.dev docs previews.
#
# To stop labeling a surface, remove its line from `paths` below.

name: Shopify Dev preview label

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'packages/ui-extensions/docs/surfaces/admin/generated/**/*.json'
      - 'packages/ui-extensions/docs/surfaces/checkout/generated/**/*.json'
      - 'packages/ui-extensions/docs/surfaces/customer-account/generated/**/*.json'
      - 'packages/ui-extensions/docs/surfaces/point-of-sale/generated/**/*.json'

concurrency:
  group: shopify-dev-preview-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  label:
    name: Add the shopify.dev preview label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Fork PRs get a read-only token and can't be labeled, so skip them.
    if: github.repository_owner == 'Shopify' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
    steps:
      - name: Add the label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Adding a label that's already present is a no-op.
          gh pr edit "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --add-label 'shopify.dev preview'
